apiVersion: networking.istio.io/v1beta1
kind: Gateway
metadata:
  name: mcp-gateway
spec:
  selector:
    istio: ingressgateway 
  servers:
  - port:
      number: 443
      name: https
      protocol: HTTPS
    hosts:
      - "mcp.example.com" 
    tls:
      mode: SIMPLE
      credentialName: mcp-credential 
---
apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  name: mcp-virtualservice
spec:
  hosts:
    - "mcp.example.com"
  gateways:
    - mcp-gateway
  http:
  - match:
    - uri:
        prefix: /
    route:
    - destination:
        port:
          number: 5001
        host: svc-mcp
